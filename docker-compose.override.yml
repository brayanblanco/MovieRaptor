services:
  movieraptor.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${USER_SECRETS_PATH:-$HOME/.microsoft/usersecrets}:/home/app/.microsoft/usersecrets:ro
      - ${DOTNET_CERT_PATH:-$HOME/.dotnet/corefx/cryptography/x509stores/my}:/home/app/.dotnet/corefx/cryptography/x509stores/my:ro