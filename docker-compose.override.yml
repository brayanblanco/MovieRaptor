services:
  movieraptor.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${USER_SECRETS_PATH}:/home/app/.microsoft/usersecrets:ro
      - ${USER_SECRETS_PATH}:/root/.microsoft/usersecrets:ro
      - ${HTTPS_PATH}:/home/app/.aspnet/https:ro
      - ${HTTPS_PATH}:/root/.aspnet/https:ro
      - ${DOTNET_CERT_PATH}:/home/app/.dotnet/corefx/cryptography/x509stores/my:ro
      - ${DOTNET_CERT_PATH}:/root/.dotnet/corefx/cryptography/x509stores/my:ro